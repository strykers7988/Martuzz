<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4ecf7">
<title>Una lettera per te</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap">
<style>
:root{
  --bg1:#f7f0f9; --bg2:#ead9f1; --paper:#fffaf6; --env:#e9dcef; --env-dark:#d6c1e2; --env-edge:#c7acd6;
  --ink:#4b2560; --violet:#7b3fa8; --seal:#a2344f;
  --script:"Dancing Script","Brush Script MT",cursive; --serif:"Cormorant Garamond",Georgia,serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 35%,var(--bg1) 0%,var(--bg2) 100%);color:var(--ink);font-family:var(--serif);
  overflow:hidden;-webkit-tap-highlight-color:transparent;display:grid;place-items:center;padding:16px}

/* ---------- busta ---------- */
.scene{position:relative;width:min(88vw,420px);aspect-ratio:1.45;perspective:1200px;cursor:pointer;
  transition:transform .9s cubic-bezier(.6,0,.2,1),opacity .7s ease;animation:float 3.6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px) rotate(-.6deg)}}
.scene:focus-visible{outline:2px solid var(--violet);outline-offset:10px;border-radius:12px}
.env-back{position:absolute;inset:0;background:var(--env-dark);border-radius:10px;box-shadow:0 30px 60px -20px rgba(80,30,100,.35)}
.letter{position:absolute;left:6%;right:6%;top:8%;bottom:6%;background:var(--paper);border-radius:6px;
  box-shadow:0 2px 10px rgba(80,30,100,.12);display:grid;place-items:center;transition:transform 1s cubic-bezier(.3,1.2,.4,1) .55s;z-index:1}
.letter span{font-family:var(--script);font-size:clamp(22px,6vw,30px);color:var(--violet);opacity:.85}
.env-front{position:absolute;inset:0;z-index:2;pointer-events:none}
.env-front svg{width:100%;height:100%;display:block}
.flap{position:absolute;left:0;right:0;top:0;height:58%;transform-origin:top center;z-index:3;transition:transform .7s cubic-bezier(.5,0,.3,1),z-index 0s .35s}
.flap svg{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 4px rgba(80,30,100,.12))}
.seal{position:absolute;left:50%;top:58%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;z-index:4;
  background:radial-gradient(circle at 35% 30%,#c8536f,var(--seal) 60%,#7d2139);box-shadow:0 3px 8px rgba(90,20,40,.35),inset 0 -3px 6px rgba(0,0,0,.18);
  display:grid;place-items:center;color:#ffd9e1;font-size:24px;transition:opacity .3s,transform .3s}
.hint{position:absolute;left:0;right:0;top:calc(100% + 26px);text-align:center;font-family:var(--script);font-size:24px;color:var(--violet);opacity:.8;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
.to{position:absolute;left:0;right:0;bottom:calc(100% + 22px);text-align:center;font-family:var(--script);font-size:clamp(30px,8vw,40px);color:var(--ink)}

.open .flap{transform:rotateX(180deg);z-index:0}
.open .seal{opacity:0;transform:scale(.6)}
.open .letter{transform:translateY(-62%)}
.open .hint{opacity:0;animation:none}
.gone{opacity:0;transform:translateY(40px) scale(.9);pointer-events:none}

/* ---------- biglietto con i tulipani ---------- */
.card{position:fixed;inset:0;display:grid;place-items:center;padding:16px;opacity:0;pointer-events:none;transition:opacity 1s ease}
.card.show{opacity:1;pointer-events:auto}
.paper{position:relative;width:min(92vw,440px);max-height:calc(100svh - 32px);background:var(--paper);border-radius:14px;
  box-shadow:0 40px 80px -30px rgba(80,30,100,.45);padding:22px 20px 26px;text-align:center;
  transform:translateY(30px) scale(.94);transition:transform 1.1s cubic-bezier(.2,1,.3,1);display:flex;flex-direction:column;align-items:center}
.card.show .paper{transform:none}
.paper::before{content:"";position:absolute;inset:10px;border:1px solid rgba(123,63,168,.18);border-radius:9px;pointer-events:none}
.bouquet{width:100%;max-width:330px;height:auto;flex:0 1 auto;min-height:0;max-height:62svh}
.msg{margin:6px 0 0;font-family:var(--script);font-weight:700;font-size:clamp(44px,13vw,64px);line-height:1;color:var(--violet);
  opacity:0;transform:translateY(12px);text-shadow:0 2px 0 rgba(255,255,255,.6)}
.sign{margin:10px 0 0;font-style:italic;font-size:18px;color:#7a5a8a;opacity:0}
.card.show .msg{animation:up 1.2s 3.1s ease forwards}
.card.show .sign{animation:up 1.2s 4s ease forwards}
@keyframes up{to{opacity:1;transform:none}}

/* tulipani che crescono */
.stem{stroke-dasharray:var(--len);stroke-dashoffset:var(--len)}
.card.show .stem{animation:draw 1.3s cubic-bezier(.4,0,.2,1) forwards;animation-delay:var(--d)}
@keyframes draw{to{stroke-dashoffset:0}}
.leaf{transform-box:fill-box;transform-origin:bottom center;transform:scale(0)}
.card.show .leaf{animation:grow .9s cubic-bezier(.3,1.4,.5,1) forwards;animation-delay:calc(var(--d) + .6s)}
.bloom{transform-box:fill-box;transform-origin:50% 90%;transform:scale(0)}
.card.show .bloom{animation:grow 1s cubic-bezier(.3,1.5,.5,1) forwards, sway 4s ease-in-out infinite;animation-delay:calc(var(--d) + 1.05s), calc(var(--d) + 2.2s)}
@keyframes grow{to{transform:scale(1)}}
@keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(2.5deg)}}
.ribbon{opacity:0}
.card.show .ribbon{animation:fade .8s 2.3s ease forwards}
@keyframes fade{to{opacity:1}}

/* petali che cadono */
.petal{position:fixed;top:-30px;width:14px;height:18px;border-radius:70% 10% 70% 10%;opacity:.85;pointer-events:none;
  background:linear-gradient(135deg,#c79be3,#7b3fa8);animation:fall linear forwards}
@keyframes fall{to{transform:translate3d(var(--dx),110svh,0) rotate(var(--r))}}

@media (prefers-reduced-motion:reduce){
  .scene{animation:none}
  .card.show .stem,.card.show .leaf,.card.show .bloom,.card.show .ribbon,.card.show .msg,.card.show .sign{animation-duration:.01s;animation-delay:0s}
  .petal{display:none}
}
</style>
</head>
<body>

<div class="scene" id="scene" role="button" tabindex="0" aria-label="Apri la lettera">
  <div class="to">Per te ♥</div>
  <div class="env-back"></div>
  <div class="letter"><span>Ti amo tanto</span></div>
  <div class="env-front">
    <svg viewBox="0 0 290 200" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 0 L145 110 L290 0 L290 200 L0 200 Z" fill="#e9dcef"/>
      <path d="M0 200 L120 92 M290 200 L170 92" stroke="#c7acd6" stroke-width="1.2" fill="none"/>
      <path d="M0 0 L145 110 L290 0" stroke="#d6c1e2" stroke-width="1" fill="none"/>
    </svg>
  </div>
  <div class="flap">
    <svg viewBox="0 0 290 116" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 0 H290 L152 112 Q145 117 138 112 Z" fill="#dfcbe8" stroke="#c7acd6" stroke-width="1"/>
    </svg>
  </div>
  <div class="seal" aria-hidden="true">♥</div>
  <div class="hint">tocca la lettera</div>
</div>

<div class="card" id="card" aria-live="polite">
  <div class="paper">
    <svg class="bouquet" viewBox="0 0 300 320" aria-label="Un mazzo di tulipani viola">
      <defs>
        <linearGradient id="pA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b98ade"/><stop offset=".55" stop-color="#8a4bbd"/><stop offset="1" stop-color="#5e2a86"/></linearGradient>
        <linearGradient id="pB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a873d4"/><stop offset="1" stop-color="#4f1f73"/></linearGradient>
        <linearGradient id="pC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7b3f0"/><stop offset="1" stop-color="#9157c4"/></linearGradient>
        <linearGradient id="lf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7fae63"/><stop offset="1" stop-color="#3f6e3a"/></linearGradient>
        <g id="tulip">
          <path d="M-17 -6 C-22 -26 -14 -42 -4 -48 C-9 -32 -6 -16 0 -4 Z" fill="url(#pB)"/>
          <path d="M17 -6 C22 -26 14 -42 4 -48 C9 -32 6 -16 0 -4 Z" fill="url(#pB)"/>
          <path d="M-15 -4 C-18 -26 -8 -44 0 -52 C8 -44 18 -26 15 -4 C10 4 -10 4 -15 -4 Z" fill="url(#pA)"/>
          <path d="M-6 -6 C-8 -24 -3 -38 0 -46 C3 -38 8 -24 6 -6 C3 -2 -3 -2 -6 -6 Z" fill="url(#pC)" opacity=".75"/>
          <path d="M0 -44 C-1 -30 -1 -16 0 -4" stroke="#5e2a86" stroke-width=".8" fill="none" opacity=".5"/>
        </g>
      </defs>
      <g id="flowers"></g>
      <g class="ribbon">
        <path d="M128 262 C112 250 96 252 98 264 C100 276 118 272 136 266 Z" fill="#b8418f"/>
        <path d="M172 262 C188 250 204 252 202 264 C200 276 182 272 164 266 Z" fill="#b8418f"/>
        <path d="M140 266 L120 300 L132 296 L138 306 L148 270 Z" fill="#9c2f77"/>
        <path d="M160 266 L180 300 L168 296 L162 306 L152 270 Z" fill="#9c2f77"/>
        <rect x="134" y="256" width="32" height="18" rx="7" fill="#c9549f"/>
      </g>
    </svg>
    <p class="msg">Ti amo tanto</p>
    <p class="sign">tuo, per sempre ♥</p>
  </div>
</div>

<script>
// mazzo di tulipani: [punta x, punta y, ritardo]
const TULIPS = [[150,62,0],[104,84,.15],[196,84,.25],[66,120,.35],[234,120,.45],[124,128,.55],[176,128,.65]];
const NS = 'http://www.w3.org/2000/svg', g = document.getElementById('flowers'), base = [150, 268];
TULIPS.forEach(([x, y, d], i) => {
  const cx = (x + base[0])/2 + (x < 150 ? -10 : x > 150 ? 10 : 0), cy = (y + base[1])/2 + 10;
  const stem = document.createElementNS(NS, 'path');
  stem.setAttribute('d', `M${base[0] + (x - 150)*.08} ${base[1]} Q${cx} ${cy} ${x} ${y}`);
  stem.setAttribute('class', 'stem'); stem.setAttribute('fill', 'none'); stem.setAttribute('stroke', '#4f8a43'); stem.setAttribute('stroke-width', '4'); stem.setAttribute('stroke-linecap', 'round');
  g.appendChild(stem); const len = stem.getTotalLength(); stem.style.setProperty('--len', len); stem.style.setProperty('--d', d + 's');
  const side = i % 2 ? 1 : -1, p = stem.getPointAtLength(len*.55);
  const leaf = document.createElementNS(NS, 'path');
  leaf.setAttribute('d', `M${p.x} ${p.y} C${p.x + side*26} ${p.y - 8} ${p.x + side*30} ${p.y - 40} ${p.x + side*10} ${p.y - 58} C${p.x + side*14} ${p.y - 30} ${p.x + side*8} ${p.y - 12} ${p.x} ${p.y} Z`);
  leaf.setAttribute('fill', 'url(#lf)'); leaf.setAttribute('class', 'leaf'); leaf.style.setProperty('--d', d + 's'); g.appendChild(leaf);
});
TULIPS.forEach(([x, y, d]) => {
  const ang = Math.atan2(x - 150, 268 - y)*180/Math.PI*.6, s = y < 80 ? 1.12 : 1;
  const wrap = document.createElementNS(NS, 'g'); wrap.setAttribute('transform', `translate(${x} ${y + 4}) rotate(${ang}) scale(${s})`);
  const u = document.createElementNS(NS, 'use'); u.setAttribute('href', '#tulip'); u.setAttribute('class', 'bloom'); u.style.setProperty('--d', d + 's');
  wrap.appendChild(u); g.appendChild(wrap);
});

const scene = document.getElementById('scene'), card = document.getElementById('card'); let opened = false;
function open(){
  if (opened) return; opened = true;
  scene.classList.add('open'); scene.style.animation = 'none';
  setTimeout(() => scene.classList.add('gone'), 1700);
  setTimeout(() => { card.classList.add('show'); petals(); }, 2100);
}
scene.addEventListener('click', open);
scene.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); open(); } });
function petals(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  for (let i = 0; i < 26; i++){ const p = document.createElement('span'); p.className = 'petal';
    p.style.left = Math.random()*100 + 'vw'; p.style.animationDuration = 7 + Math.random()*6 + 's'; p.style.animationDelay = 2.5 + Math.random()*7 + 's';
    p.style.setProperty('--dx', (Math.random()*40 - 20) + 'vw'); p.style.setProperty('--r', (Math.random()*720 - 360) + 'deg');
    p.style.transform = `scale(${.6 + Math.random()*.7})`; document.body.appendChild(p); }
}
</script>
</body>
</html>
